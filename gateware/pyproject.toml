[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glasgow-tool-gateware"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "glasgow[builtin-toolchain] @ git+https://github.com/GlasgowEmbedded/glasgow.git@b2a15e9c797b90167d96257a557218ddb7984e71#subdirectory=software",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/glasgow_tool_gateware"]
